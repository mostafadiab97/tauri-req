# Packaging configuration (electron-builder).
# The release tool reqochet (appId com.reqochet.app); the development tool reqochet-dev can sit beside it.
appId: com.reqochet.app
productName: reqochet
directories:
  output: dist
files:
  - out/**
  - package.json
# User-editable configuration and assets are shipped as plain files next to the app,
# so the theme (and later the default schema and export templates) can be changed without rebuilding.
extraResources:
  - from: config
    to: config
  - from: resources
    to: resources
  # the licences of the bundled libraries (tools/third-party-notices.mjs)
  - from: THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
win:
  # the brand package's Windows icon: the light tile with its grey outline (the dark one looked
  # like another app's icon); while running, the taskbar icon follows the Windows colours (src/main/index.ts)
  icon: resources/brand/icon/reqochet-light.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  # One-click, per-user install: no administrator rights needed.
  oneClick: true
  perMachine: false
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
linux:
  target: [dir]
# Release feed for automatic updates: GitHub Releases of this repository. and repository name are not stored
# here (no account names in the files): CI passes them (-c.publish.owner / -c.publish.repo), and a local build
# reads them from the Git remote. electron-builder writes them into the installed app's app-update.yml.
publish:
  provider: github
