# The Tauri proof on Windows 11's engine (WebView2): build the installer, measure it, run the shared calls test and
# reqochet's e2e scenarios against it, compare memory with the public Electron reqochet, and update 0.1.0 → 0.1.1
# with a signed update (plus a changed installer that must be refused). Results: annotations of this run + artifact.
name: proof
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = everything; calls = build, install and the Tauri calls test only'
        type: choice
        options: [full, calls]
        default: full

permissions:
  contents: read

jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: upstream/ is the public copy, unchanged
        run: node tools/sync-upstream.mjs --check

      - name: Install
        run: npm ci

      - name: Throwaway update signing key and test settings
        run: |
          npx tauri signer generate --ci -w "$env:RUNNER_TEMP\upd.key" -p "x" | Out-Null
          $pub = (Get-Content "$env:RUNNER_TEMP\upd.key.pub" -Raw).Trim()
          "owner: ${{ github.repository_owner }}`nrepo: tauri-req`nprovider: github`n" | Set-Content src-tauri/app-update.yml -NoNewline
          $conf = @{
            bundle = @{ resources = @{ 'app-update.yml' = 'app-update.yml' } }
            plugins = @{ updater = @{ pubkey = $pub; endpoints = @('http://127.0.0.1:8765/latest.json'); dangerousInsecureTransportProtocol = $true; windows = @{ installMode = 'quiet' } } }
          }
          $conf | ConvertTo-Json -Depth 8 | Set-Content "$env:RUNNER_TEMP\ci.json"
          "TAURI_SIGNING_PRIVATE_KEY=$((Get-Content "$env:RUNNER_TEMP\upd.key" -Raw).Trim())" >> $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=x" >> $env:GITHUB_ENV

      - name: Build 0.1.0 (release, installer)
        run: |
          $t = Get-Date
          npx tauri build --config "$env:RUNNER_TEMP\ci.json"
          if ($LASTEXITCODE) { exit 1 }
          $secs = [int]((Get-Date) - $t).TotalSeconds
          New-Item -ItemType Directory old | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*_0.1.0_x64-setup.exe* old/
          $setup = Get-Item old/*_0.1.0_x64-setup.exe
          $exe = Get-Item src-tauri/target/release/reqochet-tauri.exe
          $mb = [math]::Round($setup.Length / 1MB, 1); $exeMb = [math]::Round($exe.Length / 1MB, 1)
          "SETUP_MB=$mb" >> $env:GITHUB_ENV
          echo "::notice title=Installer size (Tauri)::installer $mb MB ($($setup.Length) bytes); app exe $exeMb MB; build $secs s"

      - name: Build 0.1.1 (the update)
        if: github.event_name == 'push' || inputs.mode == 'full'
        run: |
          $c = Get-Content "$env:RUNNER_TEMP\ci.json" -Raw | ConvertFrom-Json
          $c | Add-Member version '0.1.1'
          $c | ConvertTo-Json -Depth 8 | Set-Content "$env:RUNNER_TEMP\v011.json"
          npx tauri build --config "$env:RUNNER_TEMP\v011.json"
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory serve | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*_0.1.1_x64-setup.exe* serve/
          $setup = (Get-Item serve/*_0.1.1_x64-setup.exe).Name
          $sig = (Get-Content "serve/$setup.sig" -Raw).Trim()
          @{ version = '0.1.1'; notes = 'proof update'; pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
             platforms = @{ 'windows-x86_64' = @{ signature = $sig; url = "http://127.0.0.1:8765/$setup" } } } | ConvertTo-Json -Depth 5 | Set-Content serve/latest.json

      - name: Install 0.1.0 (silent, per user)
        run: |
          $setup = Get-Item old/*_0.1.0_x64-setup.exe
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-Item "$env:LOCALAPPDATA\reqochet-tauri\reqochet-tauri.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:LOCALAPPDATA" -Depth 2 -Filter reqochet-tauri.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $exe) { echo "::error title=Install::reqochet-tauri.exe not found after install"; exit 1 }
          $size = [math]::Round(((Get-ChildItem $exe.DirectoryName -Recurse | Measure-Object Length -Sum).Sum) / 1MB, 1)
          echo "::notice title=Installed size (Tauri)::$size MB in $($exe.DirectoryName) (WebView2 is part of Windows 11)"
          "REQOCHET_TAURI_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          git config --global user.name "Proof Bot"
          git config --global user.email "proof@example.com"
          git config --global init.defaultBranch main

      - name: Install the public Electron reqochet (the baseline on this machine)
        if: github.event_name == 'push' || inputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${{ github.repository_owner }}/reqochet" --pattern '*Setup*.exe' --dir electron
          $e = Get-ChildItem electron/*.exe | Select-Object -First 1
          Start-Process $e.FullName -ArgumentList '/S' -Wait
          $rq = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'reqochet.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $mb = [math]::Round($e.Length / 1MB, 1)
          $size = [math]::Round(((Get-ChildItem $rq.DirectoryName -Recurse | Measure-Object Length -Sum).Sum) / 1MB, 1)
          echo "::notice title=Electron baseline::$($e.Name): installer $mb MB; installed $size MB"
          "REQOCHET_ELECTRON_EXE=$($rq.FullName)" >> $env:GITHUB_ENV

      - name: Calls test — Tauri (every window.reqochet call, 10,000-item data self-test)
        continue-on-error: true
        env:
          REQOCHET_TEST_DATA: '10000'
        run: node e2e-tauri/calls-run.mjs e2e-tauri/out/calls-tauri.json

      - name: Calls test — Electron (the same test, public reqochet)
        if: github.event_name == 'push' || inputs.mode == 'full'
        continue-on-error: true
        env:
          REQOCHET_TEST_DATA: '10000'
        run: node e2e-tauri/calls-electron.mjs "$env:REQOCHET_ELECTRON_EXE" e2e-tauri/out/calls-electron.json

      - name: Memory at the start screen — Tauri and the public Electron reqochet
        if: github.event_name == 'push' || inputs.mode == 'full'
        continue-on-error: true
        run: |
          function Measure-Tree([string[]]$names) {
            $p = Get-Process -Name $names -ErrorAction SilentlyContinue
            [pscustomobject]@{ Count = $p.Count; PrivateMB = [math]::Round(($p | Measure-Object PrivateMemorySize64 -Sum).Sum / 1MB); WorkingMB = [math]::Round(($p | Measure-Object WorkingSet64 -Sum).Sum / 1MB) }
          }
          $u = Join-Path $env:RUNNER_TEMP 'mem-tauri'
          $env:REQOCHET_USER_DATA = $u
          $a = Start-Process $env:REQOCHET_TAURI_EXE -PassThru
          Start-Sleep 25
          $t = Measure-Tree @('reqochet-tauri', 'msedgewebview2')
          Stop-Process -Id $a.Id -Force; Start-Sleep 3; Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          $b = Start-Process $env:REQOCHET_ELECTRON_EXE -ArgumentList "--user-data-dir=$env:RUNNER_TEMP\mem-electron" -PassThru
          Start-Sleep 25
          $el = Measure-Tree @('reqochet')
          Get-Process reqochet -ErrorAction SilentlyContinue | Stop-Process -Force
          echo "::notice title=Memory at the start screen::Tauri: $($t.PrivateMB) MB private / $($t.WorkingMB) MB working set in $($t.Count) processes (app + WebView2). Electron reqochet: $($el.PrivateMB) MB private / $($el.WorkingMB) MB working set in $($el.Count) processes."

      - name: E2E scenarios (reqochet's own, unchanged) over WebView2's DevTools port
        if: github.event_name == 'push' || inputs.mode == 'full'
        continue-on-error: true
        run: |
          New-Item -ItemType Junction -Path upstream/node_modules -Target "$PWD/node_modules" | Out-Null
          node e2e-tauri/run.mjs
          $r = Get-Content e2e-tauri/out/e2e-results.json -Raw | ConvertFrom-Json
          $ok = ($r | Where-Object ok).Count; $checks = ($r | Measure-Object passed -Sum).Sum; $bad = ($r | Measure-Object failed -Sum).Sum
          echo "::notice title=E2E scenarios (Tauri)::$ok of $($r.Count) scenarios pass; $checks checks passed, $bad failed"
          $lines = $r | Where-Object { -not $_.ok } | ForEach-Object { "$($_.file): $(($_.firstFailures + $_.tail | Select-Object -First 4) -join ' / ')" }
          if ($lines) { echo "::warning title=E2E scenarios failing (Tauri)::$(($lines -join ' %0A ').Replace('::', ': :'))" }

      - name: Automatic update 0.1.0 → 0.1.1 (signed), then a changed installer must be refused
        if: github.event_name == 'push' || inputs.mode == 'full'
        run: |
          $srv = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--directory', 'serve' -PassThru -WindowStyle Hidden
          Start-Sleep 2
          $u = Join-Path $env:RUNNER_TEMP 'upd'
          $env:REQOCHET_USER_DATA = $u; $env:REQOCHET_TEST = 'update'
          $start = Get-Date
          Start-Process $env:REQOCHET_TAURI_EXE
          $v = ''
          for ($i = 0; $i -lt 150; $i++) {
            Start-Sleep 2
            $v = (Get-Item $env:REQOCHET_TAURI_EXE).VersionInfo.ProductVersion
            if ($v -like '0.1.1*') { break }
          }
          # did the new version start by itself after installing? (wait a little for its first log line)
          for ($i = 0; $i -lt 10 -and -not (Get-Content "$u\update-test.log" -ErrorAction SilentlyContinue | Select-String '0.1.1 started'); $i++) { Start-Sleep 2 }
          $secs = [int]((Get-Date) - $start).TotalSeconds
          $log = (Get-Content "$u\update-test.log" -ErrorAction SilentlyContinue) -join ' | '
          Get-Process reqochet-tauri -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($v -like '0.1.1*') { echo "::notice title=Automatic update (Tauri)::0.1.0 updated itself to $v in $secs s (signed update). Log: $log" }
          else {
            $tail = ((Get-Content "$u\logs\reqochet.log" -ErrorAction SilentlyContinue) | Select-String -Pattern 'Update test|Updater|ERROR|WARN|install' | Select-Object -Last 14) -join ' %0A '
            echo "::error title=Automatic update (Tauri)::still $v after $secs s. Log: $log %0A app log: $($tail.Replace('::', ': :'))"
          }
          # a changed installer, offered as 0.1.2 with 0.1.1's signature: the updater must refuse it
          $setup = (Get-Item serve/*_0.1.1_x64-setup.exe).Name
          Copy-Item "serve/$setup" serve/tampered-setup.exe
          [IO.File]::AppendAllText("$PWD/serve/tampered-setup.exe", 'changed')
          $j = Get-Content serve/latest.json -Raw | ConvertFrom-Json
          $j.version = '0.1.2'; $j.platforms.'windows-x86_64'.url = 'http://127.0.0.1:8765/tampered-setup.exe'
          $j | ConvertTo-Json -Depth 5 | Set-Content serve/latest.json
          Start-Process $env:REQOCHET_TAURI_EXE
          Start-Sleep 40
          $v2 = (Get-Item $env:REQOCHET_TAURI_EXE).VersionInfo.ProductVersion
          $log2 = ((Get-Content "$u\update-test.log" -ErrorAction SilentlyContinue) | Select-Object -Last 2) -join ' | '
          Get-Process reqochet-tauri -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $srv.Id -Force
          if ($v2 -like '0.1.1*' -and $log2 -match 'error') { echo "::notice title=Changed installer refused (Tauri)::stayed $v2; $log2" }
          else { echo "::warning title=Changed installer (Tauri)::version $v2; $log2" }

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-results
          retention-days: 7
          path: |
            e2e-tauri/out/
            upstream/e2e/out/*.png
