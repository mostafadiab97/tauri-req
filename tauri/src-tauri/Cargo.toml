[package]
name = "reqochet-tauri"
version = "0.1.0"
description = "reqochet on Tauri — proof of concept"
edition = "2021"
license-file = "../LICENSE.md"

[lib]
name = "reqochet_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
notify = "8"
rand = "0.9"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "*"
windows = { version = "*", features = ["Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
