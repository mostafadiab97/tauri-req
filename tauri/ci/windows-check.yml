# The Tauri preview's Windows check (steps 1–4 of the owner's decision A), started by hand. Not active by itself: it
# is copied into .github/workflows/ of the repository that runs it (see tauri/README.md → "Windows check").
# Every step has a time limit (builds 15 min, tests 5 min, the e2e suite 15 min with 5 min per scenario); results are
# annotations of the run (no stored files: the private repository's storage is full until 1 Dec 2026).
name: tauri-windows-check
# the run's title in the runs list says what it was for (the owner picks installers by it)
run-name: "tauri-windows-check — ${{ inputs.scope }}${{ inputs.upload && ' (installer kept)' || '' }}"
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'all = everything; restart = update + restart diagnostics; installer = the owner''s preview installer; compare = 10,005-item project in both apps (matrix, PDF export, trips)'
        type: choice
        options: [all, restart, installer, compare]
        default: all
      upload:
        description: 'installer scope: keep the installer as a run artifact (7 days)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      NO_COLOR: '1'
      PREVIEW_DIR: 'reqochet-dev (Tauri preview)'
      PREVIEW_EXE: 'reqochet-dev-tauri-preview.exe'
      PREVIEW_DATA: 'reqochet-dev-tauri-preview'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Install (repository root for the screens and Electron, tauri/ for Tauri)
        timeout-minutes: 15
        run: |
          npm ci
          if ($LASTEXITCODE) { exit 1 }
          npm --prefix tauri ci
          if ($LASTEXITCODE) { exit 1 }

      - name: Tauri layer — lint, typecheck, Rust tests (core key)
        timeout-minutes: 15
        run: |
          npm --prefix tauri run lint; if ($LASTEXITCODE) { exit 1 }
          npm --prefix tauri run typecheck; if ($LASTEXITCODE) { exit 1 }
          Push-Location tauri/src-tauri; cargo test --lib; $c = $LASTEXITCODE; Pop-Location; if ($c) { exit 1 }

      - name: Throwaway update signing key and test settings
        if: inputs.scope != 'installer'
        run: |
          Push-Location tauri
          npx tauri signer generate --ci -w "$env:RUNNER_TEMP\upd.key" -p "x" | Out-Null
          Pop-Location
          $pub = (Get-Content "$env:RUNNER_TEMP\upd.key.pub" -Raw).Trim()
          "provider: github`n" | Set-Content tauri/src-tauri/app-update.yml -NoNewline
          foreach ($v in '0.0.1', '0.0.2') {
            @{ version = $v
               bundle = @{ resources = @{ 'app-update.yml' = 'app-update.yml' } }
               plugins = @{ updater = @{ pubkey = $pub; endpoints = @('http://127.0.0.1:8765/latest.json'); dangerousInsecureTransportProtocol = $true; windows = @{ installMode = 'quiet' } } }
            } | ConvertTo-Json -Depth 8 | Set-Content "$env:RUNNER_TEMP\ci-$v.json"
          }
          "TAURI_SIGNING_PRIVATE_KEY=$((Get-Content "$env:RUNNER_TEMP\upd.key" -Raw).Trim())" >> $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=x" >> $env:GITHUB_ENV

      - name: Build the preview installer 0.0.1
        if: inputs.scope != 'installer'
        timeout-minutes: 15
        run: |
          $t = Get-Date
          Push-Location tauri; npx tauri build --config "$env:RUNNER_TEMP\ci-0.0.1.json"; $c = $LASTEXITCODE; Pop-Location
          if ($c) { exit 1 }
          New-Item -ItemType Directory old | Out-Null
          Copy-Item tauri/src-tauri/target/release/bundle/nsis/*_0.0.1_x64-setup.exe* old/
          $setup = Get-Item old/*_0.0.1_x64-setup.exe
          echo "::notice title=Preview installer::$($setup.Name): $([math]::Round($setup.Length / 1MB, 1)) MB; build $([int]((Get-Date) - $t).TotalSeconds) s"

      - name: Build the update 0.0.2
        if: inputs.scope != 'installer' && inputs.scope != 'compare'
        timeout-minutes: 15
        run: |
          Push-Location tauri; npx tauri build --config "$env:RUNNER_TEMP\ci-0.0.2.json"; $c = $LASTEXITCODE; Pop-Location
          if ($c) { exit 1 }
          New-Item -ItemType Directory serve | Out-Null
          Copy-Item tauri/src-tauri/target/release/bundle/nsis/*_0.0.2_x64-setup.exe* serve/
          $setup = (Get-Item serve/*_0.0.2_x64-setup.exe).Name
          $sig = (Get-Content "serve/$setup.sig" -Raw).Trim()
          @{ version = '0.0.2'; notes = 'check'; pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
             platforms = @{ 'windows-x86_64' = @{ signature = $sig; url = "http://127.0.0.1:8765/$setup" } } } | ConvertTo-Json -Depth 5 | Set-Content serve/latest.json

      - name: Install the preview 0.0.1 (silent, per user) — next to nothing else
        if: inputs.scope != 'installer'
        run: |
          Start-Process (Get-Item old/*_0.0.1_x64-setup.exe).FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Depth 2 -Filter $env:PREVIEW_EXE -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { echo "::error title=Install::$env:PREVIEW_EXE not found"; exit 1 }
          $size = [math]::Round(((Get-ChildItem $exe.DirectoryName -Recurse | Measure-Object Length -Sum).Sum) / 1MB, 1)
          echo "::notice title=Installed::$size MB in $($exe.DirectoryName)"
          "REQOCHET_TAURI_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          git config --global user.name "Check Bot"
          git config --global user.email "check@example.com"
          git config --global init.defaultBranch main

      - name: Calls test — every window.reqochet call + the screens-refused checks
        if: inputs.scope == 'all' || inputs.scope == ''
        timeout-minutes: 5
        continue-on-error: true
        run: node tauri/e2e/calls-run.mjs tauri/e2e/out/calls-tauri.json

      - name: Build the Electron app from the same commit (baseline)
        if: inputs.scope == 'all' || inputs.scope == '' || inputs.scope == 'compare'
        timeout-minutes: 15
        run: npm run build

      - name: A sandbox-like project (10,005 items, the generator the sandbox was made with)
        if: inputs.scope == 'all' || inputs.scope == '' || inputs.scope == 'compare'
        timeout-minutes: 5
        run: |
          npm run gen:scenario -- "$env:RUNNER_TEMP\sandbox" 10005
          if ($LASTEXITCODE) { exit 1 }

      - name: Same project in both apps — matrix size, PDF of all items, trips for one item (Tauri)
        if: inputs.scope == 'all' || inputs.scope == '' || inputs.scope == 'compare'
        timeout-minutes: 5
        continue-on-error: true
        env:
          REQOCHET_PROBE_REPO: ${{ runner.temp }}\sandbox
          REQOCHET_PROBE_PDF: ${{ runner.temp }}\sandbox-tauri.pdf
        run: node tauri/e2e/calls-run.mjs tauri/e2e/out/probe-tauri.json

      - name: Same project in both apps (Electron, same commit)
        if: inputs.scope == 'all' || inputs.scope == '' || inputs.scope == 'compare'
        timeout-minutes: 5
        continue-on-error: true
        env:
          REQOCHET_PROBE_REPO: ${{ runner.temp }}\sandbox
          REQOCHET_PROBE_PDF: ${{ runner.temp }}\sandbox-electron.pdf
        run: |
          node tauri/e2e/calls-electron.mjs "$PWD" tauri/e2e/out/probe-electron.json
          foreach ($f in 'sandbox-tauri.pdf', 'sandbox-electron.pdf') { $p = Join-Path $env:RUNNER_TEMP $f; if (Test-Path $p) { echo "::notice title=PDF file $f::$([math]::Round((Get-Item $p).Length / 1MB, 1)) MB" } }

      - name: 50,000 items — Tauri
        if: inputs.scope == 'all' || inputs.scope == ''
        timeout-minutes: 5
        continue-on-error: true
        env:
          REQOCHET_ONLY_DATA: '1'
          REQOCHET_TEST_DATA: '50000'
        run: node tauri/e2e/calls-run.mjs tauri/e2e/out/data50k-tauri.json

      - name: 50,000 items — Electron (same commit, same runner)
        if: inputs.scope == 'all' || inputs.scope == ''
        timeout-minutes: 5
        continue-on-error: true
        env:
          REQOCHET_ONLY_DATA: '1'
          REQOCHET_TEST_DATA: '50000'
        run: node tauri/e2e/calls-electron.mjs "$PWD" tauri/e2e/out/data50k-electron.json

      - name: E2E scenarios (reqochet's own, unchanged) over WebView2's DevTools port
        if: inputs.scope == 'all' || inputs.scope == ''
        timeout-minutes: 15
        continue-on-error: true
        run: |
          node tauri/e2e/run.mjs
          $r = Get-Content tauri/e2e/out/e2e-results.json -Raw | ConvertFrom-Json
          $ok = ($r | Where-Object ok).Count; $checks = ($r | Measure-Object passed -Sum).Sum; $bad = ($r | Measure-Object failed -Sum).Sum
          echo "::notice title=E2E scenarios (Tauri)::$ok of $($r.Count) scenarios pass; $checks checks passed, $bad failed"
          $lines = $r | Where-Object { -not $_.ok } | ForEach-Object { "$($_.file): $(($_.firstFailures + $_.tail | Select-Object -First 4) -join ' / ')" }
          if ($lines) { echo "::warning title=E2E scenarios failing (Tauri)::$(($lines -join ' %0A ').Replace('::', ': :'))" }

      - name: Single instance — a second start with the same data folder quits
        if: inputs.scope != 'installer' && inputs.scope != 'compare'
        timeout-minutes: 5
        continue-on-error: true
        run: node tauri/e2e/single-instance.mjs

      - name: Update 0.0.1 → 0.0.2 and restart by itself; a changed installer must be refused
        if: inputs.scope != 'installer' && inputs.scope != 'compare'
        timeout-minutes: 5
        run: |
          $srv = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--directory', 'serve' -PassThru -WindowStyle Hidden
          Start-Sleep 2
          $u = Join-Path $env:RUNNER_TEMP 'upd'
          $env:REQOCHET_USER_DATA = $u; $env:REQOCHET_TEST = 'update'
          $start = Get-Date
          Start-Process $env:REQOCHET_TAURI_EXE
          $v = ''
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 2; $v = (Get-Item $env:REQOCHET_TAURI_EXE).VersionInfo.ProductVersion; if ($v -like '0.0.2*') { break } }
          $secs = [int]((Get-Date) - $start).TotalSeconds
          # restart: the installer starts the new version like Explorer does (fresh environment) — so it uses the normal
          # data folder; evidence = a process this step did not start + its "starting" line in the normal log
          $log = Join-Path $env:APPDATA "$env:PREVIEW_DATA\logs\reqochet.log"
          $restarted = $false
          for ($i = 0; $i -lt 30 -and -not $restarted; $i++) {
            Start-Sleep 2
            $p = Get-Process ($env:PREVIEW_EXE -replace '\.exe$', '') -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -gt $start.AddSeconds(3) }
            $restarted = $p -and (Get-Content $log -ErrorAction SilentlyContinue | Select-String '0\.0\.2 starting')
          }
          $note = ((Get-Content "$u\update-test.log" -ErrorAction SilentlyContinue) | Select-Object -Last 2) -join ' | '
          if ($v -like '0.0.2*') { echo "::notice title=Update::0.0.1 updated itself to $v in $secs s. $note" } else { echo "::error title=Update::still $v after $secs s. $note" }
          if ($restarted) { echo "::notice title=Restart after update::the new version started by itself (process + '0.0.2 starting' in the normal log)" }
          else { echo "::error title=Restart after update::no new process or no '0.0.2 starting' in $log" }
          # diagnostics: who runs here, is there a desktop shell (the installer restarts the app through Explorer), what
          # ran after the install, what the normal log says
          $me = whoami
          $sess = (Get-Process -Id $PID).SessionId
          $explorer = Get-Process explorer -ErrorAction SilentlyContinue | ForEach-Object { "pid $($_.Id) session $($_.SessionId)" }
          $procs = Get-Process | Where-Object { $_.StartTime -gt $start } | ForEach-Object { "$($_.ProcessName)#$($_.Id)@s$($_.SessionId)" } | Select-Object -First 25
          $logTail = (Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 3) -join ' | '
          echo "::notice title=Restart diagnostics::user $me, session $sess; explorer: $(if ($explorer) { $explorer -join ', ' } else { 'NONE' }); started since the update: $($procs -join ' '); normal log: $(if ($logTail) { $logTail.Replace('::', ': :') } else { 'none' })"
          # what the installer does to restart (start the app through Explorer) — does that work on this machine at all?
          Get-Process ($env:PREVIEW_EXE -replace '\.exe$', '') -ErrorAction SilentlyContinue | Stop-Process -Force
          $t2 = Get-Date
          Start-Process explorer.exe -ArgumentList "`"$env:REQOCHET_TAURI_EXE`""
          Start-Sleep 12
          $viaExplorer = Get-Process ($env:PREVIEW_EXE -replace '\.exe$', '') -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -gt $t2 }
          echo "::notice title=Start through Explorer (what the installer's restart does)::$(if ($viaExplorer) { "works here (pid $($viaExplorer[0].Id))" } else { 'does NOT start the app on this machine' })"
          Get-Process ($env:PREVIEW_EXE -replace '\.exe$', '') -ErrorAction SilentlyContinue | Stop-Process -Force
          # a changed installer, offered as 0.0.3 with 0.0.2's signature: must not be installed
          $setup = (Get-Item serve/*_0.0.2_x64-setup.exe).Name
          Copy-Item "serve/$setup" serve/tampered-setup.exe
          [IO.File]::AppendAllText("$PWD/serve/tampered-setup.exe", 'changed')
          $j = Get-Content serve/latest.json -Raw | ConvertFrom-Json
          $j.version = '0.0.3'; $j.platforms.'windows-x86_64'.url = 'http://127.0.0.1:8765/tampered-setup.exe'
          $j | ConvertTo-Json -Depth 5 | Set-Content serve/latest.json
          Start-Process $env:REQOCHET_TAURI_EXE
          Start-Sleep 40
          $v2 = (Get-Item $env:REQOCHET_TAURI_EXE).VersionInfo.ProductVersion
          $why = ((Get-Content "$u\logs\reqochet.log" -ErrorAction SilentlyContinue) | Select-String -Pattern 'signature|Updater: .*(error|fail)' | Select-Object -Last 2) -join ' | '
          Get-Process ($env:PREVIEW_EXE -replace '\.exe$', '') -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $srv.Id -Force
          if ($v2 -like '0.0.2*') { echo "::notice title=Changed installer refused::stayed $v2. $($why.Replace('::', ': :'))" } else { echo "::error title=Changed installer::now $v2" }

      - name: The owner's preview installer (version from the repository, no update feed, no test settings)
        if: inputs.scope == 'installer'
        timeout-minutes: 15
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # no update feed, so no signed update files either (they would need the signing key)
          "{ `"version`": `"$v`", `"bundle`": { `"createUpdaterArtifacts`": false } }" | Set-Content "$env:RUNNER_TEMP\owner.json"
          Push-Location tauri; npx tauri build --config "$env:RUNNER_TEMP\owner.json"; $c = $LASTEXITCODE; Pop-Location
          if ($c) { exit 1 }
          New-Item -ItemType Directory owner | Out-Null
          Copy-Item "tauri/src-tauri/target/release/bundle/nsis/*_$($v)_x64-setup.exe" owner/
          $setup = Get-Item owner/*.exe
          echo "::notice title=Owner's preview installer::$($setup.Name): $([math]::Round($setup.Length / 1MB, 1)) MB"
          "OWNER_SETUP=$($setup.FullName)" >> $env:GITHUB_ENV

      - name: Install and start it — up to date, no errors (no update feed)
        if: inputs.scope == 'installer'
        timeout-minutes: 5
        run: |
          Start-Process $env:OWNER_SETUP -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Depth 2 -Filter $env:PREVIEW_EXE -ErrorAction SilentlyContinue | Select-Object -First 1
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep 25
          $log = Join-Path $env:APPDATA "$env:PREVIEW_DATA\logs\reqochet.log"
          $lines = Get-Content $log -ErrorAction SilentlyContinue
          $status = ($lines | Select-String 'Update status' | Select-Object -Last 1)
          $errors = ($lines | Select-String 'ERROR' | Select-Object -First 3) -join ' | '
          $version = (Get-Item $exe.FullName).VersionInfo.ProductVersion
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          $ok = ($status -match 'up-to-date') -and -not $errors
          echo "::$(if ($ok) { 'notice' } else { 'error' }) title=Owner's preview started::version $version; $status; errors: $(if ($errors) { $errors.Replace('::', ': :') } else { 'none' })"
          if (-not $ok) { exit 1 }

      - name: Icons — the installed program and its shortcuts (light icon, not the old dark tile)
        if: inputs.scope == 'installer'
        timeout-minutes: 5
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Depth 2 -Filter $env:PREVIEW_EXE -ErrorAction SilentlyContinue | Select-Object -First 1
          function Bmp($icon) { $b = New-Object System.Drawing.Bitmap 32, 32; $g = [System.Drawing.Graphics]::FromImage($b); $g.DrawIcon($icon, (New-Object System.Drawing.Rectangle 0, 0, 32, 32)); $g.Dispose(); $b }
          function FromPng($p) { $i = [System.Drawing.Image]::FromFile((Resolve-Path $p).Path); $b = New-Object System.Drawing.Bitmap 32, 32; $g = [System.Drawing.Graphics]::FromImage($b); $g.DrawImage($i, 0, 0, 32, 32); $g.Dispose(); $b }
          function Diff($a, $b) { $d = 0; for ($x = 0; $x -lt 32; $x++) { for ($y = 0; $y -lt 32; $y++) { $p = $a.GetPixel($x, $y); $q = $b.GetPixel($x, $y); $d += [math]::Abs($p.R - $q.R) + [math]::Abs($p.G - $q.G) + [math]::Abs($p.B - $q.B) } }; [math]::Round($d / (32 * 32 * 3), 1) }
          $embedded = Bmp ([System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName))
          $light = Bmp (New-Object System.Drawing.Icon ((Resolve-Path resources/brand/icon/reqochet-light.ico).Path), 32, 32)
          $dark = FromPng resources/brand/icon/png/reqochet-icon-32.png
          $dl = Diff $embedded $light; $dd = Diff $embedded $dark
          $which = if ($dl -lt $dd) { 'the light icon (reqochet-light.ico)' } else { 'the OLD DARK tile' }
          $sh = New-Object -ComObject WScript.Shell
          $links = Get-ChildItem "$env:USERPROFILE\Desktop", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter '*Tauri preview*.lnk' -ErrorAction SilentlyContinue | ForEach-Object { $l = $sh.CreateShortcut($_.FullName); "$($_.Name): target $([IO.Path]::GetFileName($l.TargetPath)), icon '$($l.IconLocation)'" }
          echo "::notice title=Icons::program icon = $which (difference to light $dl, to dark $dd, 0 = same picture); shortcuts: $(if ($links) { $links -join ' | ' } else { 'none found' })"
          if ($dl -ge $dd) { exit 1 }

      - name: Keep the owner's installer
        if: inputs.scope == 'installer' && inputs.upload
        uses: actions/upload-artifact@v4
        with:
          name: reqochet-dev-tauri-preview-setup
          retention-days: 7
          path: owner/*.exe
